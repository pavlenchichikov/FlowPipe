<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-label="FlowPipe - visual ETL pipeline builder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1640"/>
      <stop offset="0.55" stop-color="#221b4c"/>
      <stop offset="1" stop-color="#191333"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.62" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#4f8ef7" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#4f8ef7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f8ef7"/>
      <stop offset="0.5" stop-color="#f4a73c"/>
      <stop offset="1" stop-color="#35d6a0"/>
    </linearGradient>
    <linearGradient id="wire1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f8ef7"/><stop offset="1" stop-color="#f4a73c"/>
    </linearGradient>
    <linearGradient id="wire2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4a73c"/><stop offset="1" stop-color="#35d6a0"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="340" fill="url(#bg)"/>
  <rect width="1280" height="340" fill="url(#grid)"/>
  <rect width="1280" height="340" fill="url(#halo)"/>

  <text x="74" y="70" font-family="'JetBrains Mono','Consolas',monospace" font-size="13"
        letter-spacing="5" fill="#8f88c4">VISUAL ETL PIPELINE BUILDER</text>

  <text x="70" y="142" font-family="'Sora','Quicksand','Segoe UI',sans-serif"
        font-weight="700" font-size="74" fill="#f3f1fb">Flow<tspan fill="url(#flow)">Pipe</tspan></text>
  <path d="M76 158 C 180 146 250 170 360 156" fill="none" stroke="url(#flow)"
        stroke-width="3.5" stroke-linecap="round" filter="url(#glow)"/>

  <text x="74" y="196" font-family="'Sora','Segoe UI',sans-serif" font-size="19" fill="#b7b1de">Wire nodes. Preview the data. Ship the pipeline.</text>

  <g>
    <rect x="74" y="224" width="232" height="30" rx="15" fill="#251e52" stroke="#48417e" stroke-width="1"/>
    <circle cx="92" cy="239" r="4" fill="#35d6a0" filter="url(#glow)"/>
    <text x="104" y="243" font-family="'JetBrains Mono','Consolas',monospace" font-size="12"
          letter-spacing="1" fill="#9b95c4">exports to Python or cron</text>
  </g>

  <g stroke-linecap="round" fill="none">
    <path d="M698 138 C 744 138 748 196 788 196" stroke="url(#wire1)" stroke-width="3.5" filter="url(#glow)"/>
    <path d="M938 196 C 984 196 988 134 1028 134" stroke="url(#wire2)" stroke-width="3.5" filter="url(#glow)"/>
  </g>
  <circle cx="744" cy="160" r="5" fill="#cfe0ff" filter="url(#glow)"/>
  <circle cx="985" cy="168" r="5" fill="#bff3df" filter="url(#glow)"/>

  <g font-family="'Sora','Segoe UI',sans-serif">
    <g>
      <rect x="548" y="92" width="150" height="92" rx="12" fill="#2a2456" stroke="#4a4488" stroke-width="1.5"/>
      <rect x="548" y="92" width="150" height="24" rx="12" fill="#4f8ef7"/>
      <rect x="548" y="104" width="150" height="12" fill="#4f8ef7"/>
      <text x="566" y="109" font-size="11" font-weight="600" letter-spacing="2" fill="#0d1330">SOURCE</text>
      <text x="566" y="146" font-size="17" font-weight="600" fill="#f3f1fb">CSV File</text>
      <text x="566" y="168" font-family="'JetBrains Mono',monospace" font-size="12" fill="#9b95c4">sales.csv</text>
      <circle cx="698" cy="138" r="6" fill="#4f8ef7" stroke="#1b1640" stroke-width="2"/>
    </g>
    <g>
      <rect x="788" y="150" width="150" height="92" rx="12" fill="#2a2456" stroke="#4a4488" stroke-width="1.5"/>
      <rect x="788" y="150" width="150" height="24" rx="12" fill="#f4a73c"/>
      <rect x="788" y="162" width="150" height="12" fill="#f4a73c"/>
      <text x="806" y="167" font-size="11" font-weight="600" letter-spacing="2" fill="#2a1c05">TRANSFORM</text>
      <text x="806" y="204" font-size="17" font-weight="600" fill="#f3f1fb">Aggregate</text>
      <text x="806" y="226" font-family="'JetBrains Mono',monospace" font-size="12" fill="#9b95c4">by region</text>
      <circle cx="788" cy="196" r="6" fill="#f4a73c" stroke="#1b1640" stroke-width="2"/>
      <circle cx="938" cy="196" r="6" fill="#f4a73c" stroke="#1b1640" stroke-width="2"/>
    </g>
    <g>
      <rect x="1028" y="88" width="150" height="92" rx="12" fill="#2a2456" stroke="#4a4488" stroke-width="1.5"/>
      <rect x="1028" y="88" width="150" height="24" rx="12" fill="#35d6a0"/>
      <rect x="1028" y="100" width="150" height="12" fill="#35d6a0"/>
      <text x="1046" y="105" font-size="11" font-weight="600" letter-spacing="2" fill="#04261a">DESTINATION</text>
      <text x="1046" y="142" font-size="17" font-weight="600" fill="#f3f1fb">Database</text>
      <text x="1046" y="164" font-family="'JetBrains Mono',monospace" font-size="12" fill="#9b95c4">results</text>
      <circle cx="1028" cy="134" r="6" fill="#35d6a0" stroke="#1b1640" stroke-width="2"/>
    </g>
  </g>

  <rect x="8" y="8" width="1264" height="324" rx="10" fill="none" stroke="#4a4488" stroke-opacity="0.5" stroke-width="1.5"/>
</svg>
