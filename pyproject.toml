[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flowpipe-etl"
version = "0.1.0"
description = "Visual ETL pipeline builder with drag-and-drop interface"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Pavel Galashin" }]
keywords = ["etl", "pipeline", "data", "drag-and-drop", "visual"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "sqlalchemy>=2.0",
    "apscheduler>=3.10",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
]
postgres = ["psycopg2-binary>=2.9"]
mysql = ["pymysql>=1.1"]

[project.scripts]
flowpipe = "flowpipe.__main__:main"

[project.urls]
Homepage = "https://github.com/pavlenchichikov/flowpipe"
Repository = "https://github.com/pavlenchichikov/flowpipe"
Issues = "https://github.com/pavlenchichikov/flowpipe/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/flowpipe"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
# codegen holds dense one-line pandas templates; test fixtures inline long specs.
"src/flowpipe/codegen.py" = ["E501", "UP031"]
"tests/test_pipeline.py" = ["E501"]
# node codegen() methods build %-formatted source-code strings (templates),
# not user-facing text; %-formatting reads clearer than f-strings/format() there.
"src/flowpipe/nodes/base.py" = ["UP031"]
"src/flowpipe/nodes/sources.py" = ["UP031", "E501"]
"src/flowpipe/nodes/transforms.py" = ["UP031", "E501"]
"src/flowpipe/nodes/destinations.py" = ["UP031", "E501"]
"src/flowpipe/validation.py" = ["UP031"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
